services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lapikud
      POSTGRES_PASSWORD: lapikud
      POSTGRES_DB: lapikud
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lapikud"]
      interval: 5s
      timeout: 5s
      retries: 10

  garage:
    image: dxflrs/garage:v2.1.0
    command: ["/garage", "-c", "/etc/garage.toml", "server"]
    ports:
      - "3900:3900"
      - "3901:3901"
    volumes:
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
      - ./garage.toml:/etc/garage.toml:ro
    healthcheck:
      test: ["CMD", "/garage", "-c", "/etc/garage.toml", "status"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  garage-meta:
  garage-data:
