name: Deploy to production

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy to LXC
    # Only the act_runner inside the proliige container has this label.
    runs-on: proliige
    steps:
      # Runs the deploy script from the pushed commit, so changes to it apply to this deploy.
      - name: Check out code
        uses: actions/checkout@v4

      - name: Run deploy script
        run: scripts/deploy/deploy.sh
